[project]
name = "redact-all-the-things-tooling"
version = "0.1.0"
description = "Repository tooling for Redact All The Things"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.43.56",
    "fastapi==0.140.0",
    "gliner2==1.3.2",
    "mangum==0.21.0",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "pypdfium2==5.12.1",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "pre-commit==4.6.1",
  "pymarkdownlnt==0.9.39",
  "pytest==9.1.1",
  "yamllint==1.38.0",
  "ipykernel",

]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "floci: requires the local Floci emulator",
]
